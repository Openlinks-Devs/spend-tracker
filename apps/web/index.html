<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Generated by scripts/generate-favicon.py. Edit the geometry there and
         re-run it rather than hand-editing the binaries. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>SpendTracker</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      // Runs standalone (no bundle yet), and reads the same key as lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('spendtracker-theme')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
        } catch (error) {
          /* Private mode can throw on localStorage; light is a safe default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
